name: Release

# Tag a version to cut a release:
#
#   npm version 2.0.0 && git push --follow-tags
#
# Each platform is built on its own runner, because each has to be: an
# Electron app carries a native module (@lydell/node-pty), and the prebuild npm
# installs is the one for the machine doing the installing. Cross-building
# would produce a package whose terminal does not open — on someone else's
# computer, after release.
#
# One draft release, created *before* the builds start. When every platform
# job ran `electron-builder --publish always` on its own, four jobs racing to
# find a draft for the tag each created one — four drafts, one installer in
# each. Now a single job makes the draft and each platform uploads into it as
# it finishes, so a platform that is slow (or a runner that never comes) does
# not hold the others back. Nothing is public until someone publishes the
# draft.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Use SignPath test-signing on Windows; keep artifacts without creating a release'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: One draft for every platform to upload into
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # idempotent, so a re-run on the same tag reuses the draft it made
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — uploading into it"
          else
            gh release create "$tag" --draft --verify-tag \
              --title "Flare ${tag#v}" \
              --notes "Installers are attached as each platform finishes building."
          fi

  build:
    name: ${{ matrix.name }}
    needs: draft
    # a dry run skips the draft; the builds still have to happen
    if: ${{ always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      # one platform failing should not throw away the others: a release with
      # three of four installers is worth having while the fourth is fixed
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
          - name: macOS (Apple silicon)
            os: macos-latest
          # Intel Macs are a separate runner rather than a cross-build, for the
          # native-module reason above. macos-13 was retired by GitHub and
          # queued forever; macos-15-intel is the Intel runner that remains.
          - name: macOS (Intel)
            os: macos-15-intel
          - name: Linux (x64)
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        # The unit suite only. The end-to-end suites drive a real Electron
        # window and a browser, which needs a display server this job does not
        # have — they run on a developer's machine before the tag is cut.
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        if: runner.os != 'Windows'
        run: npx electron-builder --publish never

      - name: Check Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (!$env:SIGNPATH_API_TOKEN) { throw 'Set the SIGNPATH_API_TOKEN Actions secret. See docs/windows-signing.md.' }

      - name: Prepare Windows application
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --dir --publish never -c.win.signExecutable=false

      - name: Upload application for signing
        if: runner.os == 'Windows'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-app
          path: release/win-unpacked/Flare.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign Windows application
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: d5edea92-dfed-4a46-aa85-32c94fdec2c1
          project-slug: Flare
          signing-policy-slug: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'test-signing' || 'release-signing' }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/app

      - name: Verify and package signed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TRUST_SIGNPATH_TEST_CERTIFICATE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          ./scripts/verify-windows-signature.ps1 -Path signed/app/Flare.exe -TrustTestCertificate:($env:TRUST_SIGNPATH_TEST_CERTIFICATE -eq 'true')
          Copy-Item -LiteralPath signed/app/Flare.exe -Destination release/win-unpacked/Flare.exe -Force
          npx electron-builder --win nsis zip --x64 --prepackaged release/win-unpacked --publish never -c.win.signExecutable=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-windows-signature.ps1 -Path release/win-unpacked/Flare.exe -SameSignerAs signed/app/Flare.exe

      - name: Upload installer for signing
        if: runner.os == 'Windows'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: release/Flare-*-Windows-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign Windows installer
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: d5edea92-dfed-4a46-aa85-32c94fdec2c1
          project-slug: Flare
          signing-policy-slug: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'test-signing' || 'release-signing' }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer

      - name: Verify final Windows artifacts and refresh update metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/verify-windows-signature.ps1 -Path 'signed/installer/Flare-*-Windows-x64.exe' -SameSignerAs signed/app/Flare.exe
          Get-Item signed/installer/Flare-*-Windows-x64.exe | Copy-Item -Destination release -Force
          $archives = @(Get-Item release/Flare-*-Windows-x64.zip)
          if ($archives.Count -ne 1) { throw 'Expected one Windows portable archive' }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath signed/portable
          ./scripts/verify-windows-signature.ps1 -Path signed/portable/Flare.exe -SameSignerAs signed/app/Flare.exe
          node scripts/refresh-windows-update-metadata.mjs release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload into the draft
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --clobber so re-running a platform replaces its installer rather
        # than failing on the name; the blockmaps and latest*.yml ride along
        # for anything that updates itself from the release later
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.exe.blockmap release/*.zip release/*.dmg release/*.dmg.blockmap release/*.AppImage release/*.deb release/*.tar.gz release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing packaged for ${{ matrix.name }}" >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: flare-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
